<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impro Ruletka</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    cursor: none; user-select: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .layer { position: fixed; inset: 0; display: none; }
  .on { display: block; }

  #logo { background: #f07a10; }
  #logo .bg {
    position: absolute; inset: -10%;
    background: url("is.png") center / cover;
    filter: blur(40px);
  }
  #logo .fg {
    position: absolute; inset: 0; margin: auto;
    height: 100%; width: auto; max-width: 100%;
  }

  #pic img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
  }
  #pic.reveal img { animation: reveal 0.9s ease-out; }
  @keyframes reveal { from { transform: scale(1.06); } to { transform: scale(1); } }
  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
  }
  #pic.reveal #flash { animation: flash 0.7s ease-out; }
  @keyframes flash { from { opacity: 0.8; } to { opacity: 0; } }

  #warn {
    position: fixed; left: 0; right: 0; bottom: 20px; text-align: center;
    font: 24px sans-serif; color: #fff; background: #b00; padding: 10px; display: none;
  }
  #load {
    position: fixed; right: 16px; bottom: 16px; z-index: 1;
    font: 18px sans-serif; color: #fff; background: rgba(0,0,0,0.6);
    padding: 6px 12px; border-radius: 6px; transition: opacity 1s;
  }
  #load.done { opacity: 0; }
</style>
</head>
<body>
<div id="logo" class="layer on">
  <div class="bg"></div>
  <img class="fg" src="is.png" alt="">
</div>
<div id="pic" class="layer">
  <img id="picImg" alt="">
  <div id="flash"></div>
</div>
<div id="warn">Brak obrazów — dodaj pliki do folderu obrazy/ i wpisz je do obrazy.js</div>
<div id="load"></div>

<script src="obrazy.js"></script>
<script>
// Cykl dla jednej grupy (każdy krok = Enter):
// logo → losowanie → obraz → blackout → obraz (ten sam) → logo dla następnej grupy.
const NEXT_KEYS = ["Enter", " ", "ArrowRight", "ArrowDown", "PageDown"];
const BACK_KEYS = ["Backspace", "ArrowLeft", "ArrowUp", "PageUp"];

const sources = (typeof OBRAZY !== "undefined" ? OBRAZY : []).map(encodeURI);
let all = []; // filled with in-memory URLs once every painting has loaded
const keepAlive = [];

const logoEl = document.getElementById("logo");
const picEl = document.getElementById("pic");
const picImg = document.getElementById("picImg");
const loadEl = document.getElementById("load");
const warnEl = document.getElementById("warn");

// Blob URLs keep each painting in memory for the whole session, so the show never needs the network again.
// fetch() is refused on file://, but there the files are local anyway, so the plain path is fine.
async function preload(src) {
  let url = src;
  try {
    const r = await fetch(src);
    if (r.ok) url = URL.createObjectURL(await r.blob());
  } catch {}
  const img = new Image();
  img.src = url;
  await img.decode();
  keepAlive.push(img);
  return url;
}

async function preloadAll() {
  if (sources.length === 0) { warnEl.style.display = "block"; loadEl.remove(); return; }
  let done = 0;
  const failed = [];
  const show = () => loadEl.textContent = `Wczytywanie obrazów ${done}/${sources.length}`;
  show();
  const urls = await Promise.all(sources.map(src =>
    preload(src).catch(() => { failed.push(decodeURI(src)); return null; })
                .finally(() => { done++; show(); })));
  all = urls.filter(Boolean);
  if (failed.length) {
    warnEl.textContent = `Nie wczytano ${failed.length} obrazów (odśwież stronę): ${failed.join(", ")}`;
    warnEl.style.display = "block";
  }
  loadEl.textContent = `Gotowe: ${all.length} obrazów`;
  setTimeout(() => loadEl.classList.add("done"), 1500);
}
preloadAll();

// An empty pool makes the first spin refill it from `all`.
let state = { mode: "logo", img: null, pool: [] };
const history = [];
let spinning = false;
// Paintings in draw order, so keys 1–9 can bring one back if the moderator skipped past it.
const drawn = [];

function recall(n) {
  if (spinning || !drawn[n - 1]) return;
  picEl.classList.remove("reveal");
  // show2 makes the next Enter go straight to the logo; the pool stays untouched.
  go({ ...state, mode: "show2", img: drawn[n - 1] });
}

function render() {
  logoEl.classList.toggle("on", state.mode === "logo");
  picEl.classList.toggle("on", state.mode === "show" || state.mode === "show2");
  if (state.img) picImg.src = state.img;
}

function go(next) {
  history.push(state);
  state = next;
  render();
}

function next() {
  if (spinning) return;
  switch (state.mode) {
    case "logo":  return spin();
    case "show":  return go({ ...state, mode: "black" });
    case "black": return go({ ...state, mode: "show2" });
    case "show2": return go({ ...state, mode: "logo" });
  }
}

function back() {
  if (spinning || history.length === 0) return;
  state = history.pop();
  picEl.classList.remove("reveal");
  render();
}

function spin() {
  if (all.length === 0) return;
  // Each group gets a different painting; refill only once everything has been used.
  // On refill drop the last shown painting so a new cycle can't open with a repeat.
  let pool = state.pool.length ? state.pool : all.filter(p => p !== state.img);
  if (pool.length === 0) pool = all.slice();
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  const rest = pool.filter(p => p !== chosen);

  spinning = true;
  picEl.classList.remove("reveal");
  logoEl.classList.remove("on");
  picEl.classList.add("on");

  let delay = 45, prev = null;
  const tick = () => {
    if (delay > 420 || all.length === 1) {
      spinning = false;
      picImg.src = chosen;
      void picEl.offsetWidth; // restart the CSS animation
      picEl.classList.add("reveal");
      drawn.push(chosen);
      go({ mode: "show", img: chosen, pool: rest });
      return;
    }
    let cand;
    do { cand = all[Math.floor(Math.random() * all.length)]; }
    // The final spin frame must differ from the winner, or the stop looks like a stall.
    while ((all.length > 1 && cand === prev) ||
           (all.length > 2 && delay * 1.12 > 420 && cand === chosen));
    prev = cand;
    picImg.src = cand;
    delay *= 1.12;
    setTimeout(tick, delay);
  };
  tick();
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  // iPhone Safari has no Fullscreen API on regular elements.
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

document.addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") { toggleFullscreen(); return; }
  if (/^[1-9]$/.test(e.key)) { recall(+e.key); return; }
  if (NEXT_KEYS.includes(e.key)) {
    e.preventDefault();
    if (!document.fullscreenElement) toggleFullscreen();
    next();
  } else if (BACK_KEYS.includes(e.key)) {
    e.preventDefault();
    back();
  }
});

// Landscape phones are wider than 900px, so a coarse pointer also counts as mobile.
const MOBILE = matchMedia("(max-width: 900px), (pointer: coarse)");
document.addEventListener("click", () => {
  if (!MOBILE.matches) return;
  if (!document.fullscreenElement) toggleFullscreen();
  next();
});
</script>
</body>
</html>
